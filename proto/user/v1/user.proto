syntax = "proto3";

package miigho.user.v1;
option go_package = "miigho/proto/user/v1;userv1";

import "google/protobuf/timestamp.proto";

message UserProfile {
    string id = 1;
    string phone_number = 2;
    string first_name = 3;
    string last_name = 4;
    string avatar_url = 5;
    string status_message = 6;
    google.protobuf.Timestamp created_at = 7;
}

message PresenceStatus {
    string user_id = 1;
    bool is_online = 2;
    google.protobuf.Timestamp last_seen_at = 3;
}
