name: MÏÏghO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Backend (Go Test, Race, Vet & Docker Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: 'backend/go.sum'
          check-latest: true

      - name: Go Vet
        run: |
          cd backend
          go vet ./...

      - name: Go Tests with Race Detector
        run: |
          cd backend
          go test -count=1 -race -cover ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build Test
        run: |
          cd backend
          docker build -t miigho-api:ci .

  frontend-validation:
    name: Frontend (Flutter Analyze & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd app
          flutter pub get

      - name: Flutter Analyze
        run: |
          cd app
          flutter analyze

      - name: Flutter Unit & Widget Tests
        run: |
          cd app
          flutter test --exclude-tags=e2e
